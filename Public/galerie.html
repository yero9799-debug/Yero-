<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ma galerie — YERO-Ban-checker</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .wrap { max-width: 640px; }
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .top-row span { color: var(--gold); font-size: 14px; }
    .top-row button { width: auto; padding: 8px 14px; font-size: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 20px; }
    .item { position: relative; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: #0d0304; aspect-ratio: 1; }
    .item img, .item video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .item .del { position: absolute; top: 6px; right: 6px; width: auto; padding: 4px 8px; font-size: 11px; background: rgba(0,0,0,0.6); border: 1px solid var(--blood); }
    .empty { text-align: center; color: var(--ivory-dim); padding: 30px 0; font-style: italic; }
    #upload-label { display: block; text-align: center; border: 1px dashed var(--border); border-radius: var(--radius); padding: 20px; cursor: pointer; color: var(--gold); font-size: 14px; }
    #file-input { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="/logo.svg" alt="" class="crest" />
      <h1>Ma <span>Galerie</span></h1>
      <p>Ce que vous scellez ici reste vôtre</p>
    </div>

    <div class="panel">
      <div class="top-row">
        <span id="welcome"></span>
        <button id="logout-btn">Se retirer</button>
      </div>

      <label id="upload-label" for="file-input">Déposer une image ou une vidéo</label>
      <input id="file-input" type="file" accept="image/*,video/*" />

      <div id="result"></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" style="display:none;">La galerie est vide pour l'instant.</div>
    </div>

    <div class="footer-link">
      <a href="/">Retour au château</a>
    </div>
  </div>

  <script src="/galerie.js"></script>
</body>
</html>
